<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wordavator</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--bg:#f6f7f9;--ink:#1d2733;--mute:#5d6b7a;--line:#d9dee5;--acc:#c98a00;--ok:#1f7a6d;--warn:#b4432f}
@media(prefers-color-scheme:dark){:root{--bg:#1a2029;--ink:#e8ecf1;--mute:#98a4b3;--line:#2f3844;--acc:#e8ae2e;--ok:#4fb5a5;--warn:#e27a65}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
.big{font:600 44px/1 Georgia,serif}.sub{color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:5px;margin:12px 0 4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.row{display:flex;gap:16px;margin:18px 0}.row div{flex:1}.n{font:600 22px Georgia,serif}
.box{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
label{display:block;color:var(--mute);margin:8px 0 3px}input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);font:inherit}
button{margin-top:10px;padding:7px 14px;border:0;border-radius:4px;background:var(--ink);color:var(--bg);font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ok{color:var(--ok)}.bad{color:var(--warn)}
</style></head><body>
<div class="sub">Project progress</div>
<div class="big"><span id="count">0</span> <span class="sub" style="font:16px Segoe UI">/ <span id="goal">–</span> words</span></div>
<div class="bar" role="progressbar" aria-label="Progress toward goal"><i id="fill"></i></div>
<div class="sub" id="pct">Set a goal to begin.</div>
<div class="row">
 <div><div class="n" id="today">0</div><div class="sub">words today</div></div>
 <div><div class="n" id="time">0m</div><div class="sub">writing time today</div></div>
</div>
<div class="row" style="margin-top:0">
 <div><div class="n" id="streak">0 days</div><div class="sub" id="streakNote">current streak</div></div>
 <div><div class="n" id="best">0 days</div><div class="sub">longest streak</div></div>
</div>
<div class="box"><b>Forecast</b><div id="fc" class="sub">Write for a day or two and the forecast will appear.</div></div>
<div class="box"><b>Project settings</b>
 <label for="g">Word count goal</label><input id="g" type="number" min="1" placeholder="e.g. 80000">
 <label for="d">Deadline (optional)</label><input id="d" type="date">
 <button id="save">Save goal</button></div>
<script>
const $=id=>document.getElementById(id);
let S={goal:0,deadline:"",log:{},startDate:""},count=0,lastChange=0,lastCount=null,store;
const day=()=>new Date().toISOString().slice(0,10);
const IDLE=60000,TICK=2000;
function load(){try{const v=Office.context.document.settings.get("wordavator");if(v)S=JSON.parse(v)}catch(e){}}
function persist(){try{Office.context.document.settings.set("wordavator",JSON.stringify(S));Office.context.document.settings.saveAsync()}catch(e){}}
async function words(){return Word.run(async c=>{const b=c.document.body;b.load("text");await c.sync();const t=b.text.trim();return t?t.split(/\s+/).length:0})}
function fmt(s){const m=Math.round(s/60);return m<60?m+"m":Math.floor(m/60)+"h "+(m%60)+"m"}
async function tick(){
 count=await words();const t=day(),now=Date.now();
 if(!S.startDate)S.startDate=t;
 const L=S.log[t]||(S.log[t]={start:count,end:count,sec:0});
 if(lastCount!==null&&count!==lastCount)lastChange=now;
 if(now-lastChange<IDLE)L.sec+=TICK/1000;
 lastCount=count;L.end=count;persist();render()}
const prev=k=>new Date(new Date(k+"T00:00:00Z")-864e5).toISOString().slice(0,10);
function streaks(){
 const set=new Set(Object.keys(S.log).filter(k=>S.log[k].end>S.log[k].start)),t=day();
 let cur=0,k=set.has(t)?t:prev(t);
 while(set.has(k)){cur++;k=prev(k)}
 let best=0;
 for(const d of set){if(set.has(prev(d)))continue;let n=0,x=d;while(set.has(x)){n++;x=new Date(new Date(x+"T00:00:00Z").getTime()+864e5).toISOString().slice(0,10)}best=Math.max(best,n)}
 const u=n=>n+(n===1?" day":" days");
 $("streak").textContent=u(cur);$("best").textContent=u(Math.max(best,cur));
 $("streakNote").textContent=cur&&!set.has(t)?"write today to keep it":"current streak"}
function render(){
 const L=S.log[day()]||{start:count,sec:0};
 $("count").textContent=count.toLocaleString();$("goal").textContent=S.goal?S.goal.toLocaleString():"–";
 const p=S.goal?Math.min(100,count/S.goal*100):0;$("fill").style.width=p+"%";
 $("pct").textContent=S.goal?p.toFixed(1)+"% complete · "+Math.max(0,S.goal-count).toLocaleString()+" to go":"Set a goal to begin.";
 $("today").textContent=Math.max(0,count-L.start).toLocaleString();$("time").textContent=fmt(L.sec||0);
 streaks();
 const days=Object.keys(S.log).sort().slice(-14);
 if(!S.goal||days.length<2){return}
 const net=days.reduce((a,k)=>a+Math.max(0,S.log[k].end-S.log[k].start),0);
 const span=Math.max(1,Math.round((new Date(day())-new Date(days[0]))/864e5)+1);
 const pace=net/span,left=S.goal-count;let h="";
 if(left<=0){h='<span class="ok">Goal reached.</span>'}
 else if(pace<=0){h="No net progress recently, so there's no forecast yet."}
 else{const dt=new Date(Date.now()+Math.ceil(left/pace)*864e5);
  h="At "+Math.round(pace).toLocaleString()+" words/day (last "+span+" days) you finish around <b>"+dt.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})+"</b>.";
  if(S.deadline){const dl=Math.max(1,Math.ceil((new Date(S.deadline)-new Date(day()))/864e5)),need=left/dl;
   h+=need>pace?'<br><span class="bad">Behind: you need '+Math.round(need).toLocaleString()+'/day to hit '+S.deadline+'.</span>':'<br><span class="ok">On track for '+S.deadline+' (needs '+Math.round(need).toLocaleString()+'/day).</span>'}}
 $("fc").innerHTML=h}
$("save").onclick=()=>{S.goal=parseInt($("g").value)||S.goal;S.deadline=$("d").value||S.deadline;persist();render()};
Office.onReady(()=>{load();$("g").value=S.goal||"";$("d").value=S.deadline||"";tick();setInterval(tick,TICK)});
</script></body></html>
